# Overlay for a hardened local/staging run. Does not publish database or object-storage ports.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
# Requires a real .env (never commit it) with APP_ENV=production and strong secrets.

services:
  db:
    ports: []
  redis:
    ports: []
  minio:
    ports: []
  mailhog:
    profiles: ["mailhog"]
  api:
    environment:
      APP_ENV: production
      EXPOSE_DEV_OTP: "false"
      LOG_FORMAT: json
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Set FRONTEND_BASE_URL to the public Vedas Learning URL}
    ports:
      - "127.0.0.1:${HOST_API_PORT:-8000}:8000"
  worker:
    environment:
      APP_ENV: production
      LOG_FORMAT: json
      EXPOSE_DEV_OTP: "false"
