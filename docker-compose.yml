x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-build: &app-build
  context: .
  dockerfile: backend/Dockerfile

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veda}
      POSTGRES_DB: ${POSTGRES_DB:-veda}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:${HOST_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${HOST_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: adobe/s3mock:3.12.0
    environment:
      initialBuckets: ${S3_BUCKET:-veda-audio}
      root: /data
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${HOST_S3_PORT:-9000}:9090"
    restart: unless-stopped
    logging: *default-logging

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "127.0.0.1:${HOST_MAILHOG_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${HOST_MAILHOG_UI_PORT:-8025}:8025"
    restart: unless-stopped
    logging: *default-logging

  api:
    build: *app-build
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-veda}:${POSTGRES_PASSWORD:-veda}@db:5432/${POSTGRES_DB:-veda}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9090
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-veda-audio}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://127.0.0.1:${HOST_WEB_PORT:-8080}}
      EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS:-86400}
      EXPOSE_DEV_OTP: ${EXPOSE_DEV_OTP:-false}
      CORS_ORIGINS: "http://localhost:${HOST_WEB_PORT:-8080},http://127.0.0.1:${HOST_WEB_PORT:-8080},${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      CONTENT_PATH: /content/rigveda_lessons.json
      AUDIO_STORE: s3
      EVALUATION_ENGINE: ${EVALUATION_ENGINE:-none}
      EVALUATION_ENGINE_VERSION: ${EVALUATION_ENGINE_VERSION:-0}
      ALIGNMENT_ENGINE: ${ALIGNMENT_ENGINE:-none}
      ALIGNMENT_ENGINE_VERSION: ${ALIGNMENT_ENGINE_VERSION:-0}
      PRONUNCIATION_ENGINE: ${PRONUNCIATION_ENGINE:-none}
      PRONUNCIATION_ENGINE_VERSION: ${PRONUNCIATION_ENGINE_VERSION:-0}
      EVALUATION_TEST_MODE: ${EVALUATION_TEST_MODE:-false}
      DEVELOPMENT_GURU_REFERENCE_DIR: ${DEVELOPMENT_GURU_REFERENCE_DIR:-/guru-reference-audio}
      SANSKRIT_ASR_ENABLED: ${SANSKRIT_ASR_ENABLED:-false}
      PRONUNCIATION_EVALUATION_ENABLED: ${PRONUNCIATION_EVALUATION_ENABLED:-false}
      GOP_ENABLED: ${GOP_ENABLED:-false}
      VEDIC_ACCENT_EVALUATION_ENABLED: ${VEDIC_ACCENT_EVALUATION_ENABLED:-false}
      SANSKRIT_ASR_MODEL_DIR: ${SANSKRIT_ASR_MODEL_DIR:-/models/sushrota}
      SANSKRIT_ALIGNER_MODEL_PATH: ${SANSKRIT_ALIGNER_MODEL_PATH:-/models/vedic-aligner/model.int8.onnx}
      SANSKRIT_ALIGNER_VOCAB_PATH: ${SANSKRIT_ALIGNER_VOCAB_PATH:-/models/vedic-aligner/vocab.json}
      AUDIO_SAMPLE_RATE: ${AUDIO_SAMPLE_RATE:-16000}
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      MODEL_CACHE_DIR: /models
      MODEL_NUM_THREADS: ${MODEL_NUM_THREADS:-2}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./content:/content:ro
      - ./mobile/assets/audio/guru_reference:/guru-reference-audio:ro
      - ./data/models:/models:ro
    ports:
      - "127.0.0.1:${HOST_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    logging: *default-logging

  worker:
    build: *app-build
    command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-veda}:${POSTGRES_PASSWORD:-veda}@db:5432/${POSTGRES_DB:-veda}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9090
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-veda-audio}
      CONTENT_PATH: /content/rigveda_lessons.json
      AUDIO_STORE: s3
      EVALUATION_ENGINE: ${EVALUATION_ENGINE:-none}
      EVALUATION_ENGINE_VERSION: ${EVALUATION_ENGINE_VERSION:-0}
      ALIGNMENT_ENGINE: ${ALIGNMENT_ENGINE:-none}
      ALIGNMENT_ENGINE_VERSION: ${ALIGNMENT_ENGINE_VERSION:-0}
      PRONUNCIATION_ENGINE: ${PRONUNCIATION_ENGINE:-none}
      PRONUNCIATION_ENGINE_VERSION: ${PRONUNCIATION_ENGINE_VERSION:-0}
      EVALUATION_TEST_MODE: ${EVALUATION_TEST_MODE:-false}
      DEVELOPMENT_GURU_REFERENCE_DIR: ${DEVELOPMENT_GURU_REFERENCE_DIR:-/guru-reference-audio}
      SANSKRIT_ASR_ENABLED: ${SANSKRIT_ASR_ENABLED:-false}
      PRONUNCIATION_EVALUATION_ENABLED: ${PRONUNCIATION_EVALUATION_ENABLED:-false}
      GOP_ENABLED: ${GOP_ENABLED:-false}
      VEDIC_ACCENT_EVALUATION_ENABLED: ${VEDIC_ACCENT_EVALUATION_ENABLED:-false}
      SANSKRIT_ASR_MODEL_DIR: ${SANSKRIT_ASR_MODEL_DIR:-/models/sushrota}
      SANSKRIT_ALIGNER_MODEL_PATH: ${SANSKRIT_ALIGNER_MODEL_PATH:-/models/vedic-aligner/model.int8.onnx}
      SANSKRIT_ALIGNER_VOCAB_PATH: ${SANSKRIT_ALIGNER_VOCAB_PATH:-/models/vedic-aligner/vocab.json}
      AUDIO_SAMPLE_RATE: ${AUDIO_SAMPLE_RATE:-16000}
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      MODEL_CACHE_DIR: /models
      MODEL_NUM_THREADS: ${MODEL_NUM_THREADS:-2}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./content:/content:ro
      - ./mobile/assets/audio/guru_reference:/guru-reference-audio:ro
      - ./data/models:/models:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; from redis import Redis; Redis.from_url(os.environ['REDIS_URL'], socket_timeout=2).ping()",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: ./mobile
      dockerfile: Dockerfile.web
      args:
        API_BASE_URL: http://127.0.0.1:${HOST_API_PORT:-8000}
    ports:
      - "127.0.0.1:${HOST_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  miniodata:
