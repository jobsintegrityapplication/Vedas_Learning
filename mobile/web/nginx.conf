server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Missing Flutter assets must return 404. Sending index.html with HTTP 200
    # makes nonexistent OGG clips look loadable and causes media decode errors.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
