name: veda_learning
description: Scripture learning app starter for Android and iOS.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  record: ^6.1.2
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  provider: ^6.1.2
  web: ^1.1.1
  video_player: ^2.9.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/guru_reference/
    - assets/audio/guru_words/
    - assets/videos/
    - assets/rigveda_multilingual_content_draft.json
    - assets/guru_timing_candidates.json
